name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "*.tf"
      - ".github/workflows/terraform-apply.yml"

permissions:
  id-token: write # requerido para autenticar contra Azure vía OIDC
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false # nunca cancelar un apply en curso

env:
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_AGENT }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.ARM_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ vars.ARM_TENANT_ID }}
  ARM_USE_OIDC: true

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.13"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
